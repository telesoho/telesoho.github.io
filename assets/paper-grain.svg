<svg xmlns="http://www.w3.org/2000/svg" width="216" height="216" viewBox="0 0 216 216">
  <!-- Paper texture tile, derived from the design's #paperGrain filter and #paperLines pattern. -->
  <defs>
    <filter id="g" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="8" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .34  0 0 0 0 .2  .55 0 0 0 -.18"/>
    </filter>
    <pattern id="l" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M0 35.5H36" stroke="#b68f5c" stroke-opacity=".08" stroke-width=".7"/>
      <circle cx="7" cy="8" r=".65" fill="#9b784d" opacity=".14"/>
      <circle cx="28" cy="21" r=".5" fill="#9b784d" opacity=".1"/>
    </pattern>
  </defs>
  <rect width="216" height="216" filter="url(#g)"/>
  <rect width="216" height="216" fill="url(#l)"/>
</svg>
