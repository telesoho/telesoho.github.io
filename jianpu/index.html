<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>简谱工作台 — Telesoho Studio · 索合工坊</title>
    <meta name="description" content="索合工坊 · 简谱工作台：在浏览器里读简谱、五线谱与弹唱谱，选调、变速、跟随高亮播放。" />
    <meta name="theme-color" content="#344735" />
    <link rel="icon" href="../assets/mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="jianpu.css" />
  </head>
  <body class="jp-page" data-mode="visitor">
    <a class="skip-link" href="#paper">跳到曲谱</a>

    <div class="jp-masthead">
      <img class="jp-masthead__art" src="img/workshop-band.svg" width="936" height="245" alt="" aria-hidden="true" />

      <section class="jp-intro" aria-labelledby="page-title">
        <nav class="jp-crumbs" aria-label="面包屑">
          <ol>
            <li><a href="../" aria-label="首页"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 7.5 8 2.5l6 5M3.8 6.3V13.5h8.4V6.3M6.6 13.5V9.6h2.8v3.9" /></svg></a></li>
            <li><a href="../">索合工坊</a></li>
            <li><a href="../#guitartool">音乐工具</a></li>
            <li><span aria-current="page">简谱</span></li>
          </ol>
        </nav>
        <div class="jp-intro__row">
          <span class="jp-intro__icon" aria-hidden="true"><svg viewBox="0 0 62 62"><path d="M17 39V20l21-5v19q0 8-8 9q-8 1-8-5q0-5 9-7v-7l-14 3v14z" transform="translate(3 3)" /></svg></span>
          <div>
            <h1 class="jp-intro__title" id="page-title"><span class="jp-intro__h">简谱工作台</span> <span class="jp-chip">曲谱编辑与播放</span></h1>
            <p class="jp-intro__lede">让旋律看得见，也让练习更顺手。</p>
          </div>
        </div>
      </section>
    </div>

    <main class="jp-bench" id="main">
      <div class="jp-scrim" id="scrim" hidden></div>

      <!-- ===== Library ===== -->
      <aside class="jp-panel jp-library" id="library" aria-labelledby="library-title">
        <div class="jp-panel__head">
          <svg class="jp-panel__icon" viewBox="0 0 28 26" aria-hidden="true"><path d="M2 3h18l7 7v15H2zM2 10h25" /></svg>
          <h2 id="library-title">曲谱库</h2>
          <button type="button" class="jp-panel__btn" id="library-toggle" aria-controls="library" aria-label="收起曲谱库" title="收起曲谱库">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" /></svg>
          </button>
        </div>
        <div class="jp-panel__body">
          <label class="jp-search">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6" /><path d="m13 13 5 5" /></svg>
            <input id="query" type="search" placeholder="查找曲名…" aria-label="查找曲名" autocomplete="off" />
          </label>
          <div class="jp-tabs" role="tablist" aria-label="曲谱分组">
            <button type="button" role="tab" id="tab-all" data-tab="all" aria-selected="true" aria-controls="list">全部</button>
            <button type="button" role="tab" id="tab-recent" data-tab="recent" aria-selected="false" aria-controls="list" tabindex="-1">最近使用</button>
            <button type="button" role="tab" id="tab-fav" data-tab="fav" aria-selected="false" aria-controls="list" tabindex="-1">我的收藏</button>
          </div>
          <ul class="jp-songs" id="list" role="tabpanel" aria-labelledby="tab-all"></ul>
          <p class="jp-empty" id="empty" hidden>没有匹配的曲谱。</p>
          <img class="jp-library__deco" src="img/library-staff.svg" width="272" height="72" alt="" aria-hidden="true" />
        </div>
      </aside>

      <!-- ===== Score sheet ===== -->
      <section class="jp-sheet" aria-labelledby="piece-title">
        <div class="jp-sheet__head">
          <div class="jp-sheet__id">
            <h2 id="piece-title">选择一首</h2>
            <p class="jp-sheet__meta" id="piece-meta">&nbsp;</p>
          </div>
          <div class="jp-sheet__tools" role="toolbar" aria-label="谱面工具">
            <button type="button" class="jp-pill jp-drawer-btn" id="open-library" aria-label="曲谱库" aria-controls="library" aria-expanded="false">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3.5h10l4 4v9H3zM3 7.5h14" /></svg><span>曲谱库</span>
            </button>
            <button type="button" class="jp-pill" id="zoom-out" aria-label="缩小" title="缩小谱面">
              <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6" /><path d="m13 13 4.5 4.5M5.5 8.5h6" /></svg><span>缩小</span>
            </button>
            <button type="button" class="jp-pill" id="zoom-in" aria-label="放大" title="放大谱面">
              <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6" /><path d="m13 13 4.5 4.5M5.5 8.5h6M8.5 5.5v6" /></svg><span>放大</span>
            </button>
            <button type="button" class="jp-pill" id="zoom-fit" aria-label="适应宽度" aria-pressed="true" title="适应宽度">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 6.5v-4h4m7 0h4v4m0 7v4h-4m-7 0h-4v-4" /></svg><span>适应宽度</span><output class="jp-zoom" id="zoom-level" aria-live="polite">100%</output>
            </button>
            <button type="button" class="jp-pill" id="print" aria-label="打印" title="打印谱面">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 7h12v7H4zM6 7V3h8v4M6 12h8v5H6z" /></svg><span>打印</span>
            </button>
            <button type="button" class="jp-pill jp-drawer-btn" id="open-settings" aria-label="演奏设置" aria-controls="settings" aria-expanded="false">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5l6.5 3.75v7.5L10 17.5l-6.5-3.75v-7.5z" /><circle cx="10" cy="10" r="2.5" /></svg><span>设置</span>
            </button>
          </div>
        </div>
        <div class="jp-paper" id="paper" tabindex="0" role="region" aria-label="谱面（点击音符从该处播放）"></div>
      </section>

      <!-- ===== Settings ===== -->
      <aside class="jp-panel jp-settings" id="settings" aria-labelledby="settings-title">
        <div class="jp-panel__head">
          <svg class="jp-panel__icon" viewBox="0 0 20 22" aria-hidden="true"><path d="M3 6l7-4 7 4v10l-7 5-7-5z" /><circle cx="10" cy="11" r="3" /></svg>
          <h2 id="settings-title">演奏设置</h2>
          <button type="button" class="jp-panel__btn jp-drawer-close" id="close-settings" aria-label="关闭演奏设置">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" /></svg>
          </button>
        </div>
        <div class="jp-panel__body jp-settings__body">
          <div class="jp-field">
            <span class="jp-field__label" id="tempo-label">速度</span>
            <div class="jp-field__row">
              <svg class="jp-field__icon" viewBox="0 0 24 28" aria-hidden="true"><path d="M12 2 3 26h18zM12 2v24M6.5 17.5h11" /></svg>
              <div class="jp-stepper" role="group" aria-labelledby="tempo-label">
                <button type="button" id="tempo-down" aria-label="减慢 2 BPM">−</button>
                <output id="tempo" aria-live="polite">— BPM</output>
                <button type="button" id="tempo-up" aria-label="加快 2 BPM">+</button>
              </div>
            </div>
            <button type="button" class="jp-link" id="tempo-reset" hidden>恢复原速</button>
          </div>
          <div class="jp-field">
            <span class="jp-field__label" id="meter-label">拍号</span>
            <div class="jp-field__row">
              <svg class="jp-field__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 18V5l12-2.5V15" /><circle cx="5.5" cy="18" r="2.6" /><circle cx="17.5" cy="15.5" r="2.6" /></svg>
              <output class="jp-readout" id="meter" aria-labelledby="meter-label">—</output>
            </div>
          </div>
          <div class="jp-field">
            <label class="jp-field__label" for="key">调性 <small>（选调）</small></label>
            <div class="jp-field__row">
              <svg class="jp-field__icon" viewBox="0 0 24 30" aria-hidden="true"><path d="M13 28c-3 0-4-2-3.5-3.5M14 2c-4 3-7 7-7 12 0 4 3 7 6.5 7S19 18 19 15.5 17 12 14 12s-5 2-5 4.5M14 2c2 3 2 6-1 9.5L15.5 28" /></svg>
              <span class="jp-select"><select id="key"></select></span>
            </div>
          </div>
          <div class="jp-field">
            <span class="jp-field__label" id="voice-label">乐器</span>
            <div class="jp-field__row">
              <svg class="jp-field__icon" viewBox="0 0 26 30" aria-hidden="true"><rect x="1" y="1" width="24" height="28" /><path d="M6 1v13m6-13v13m7-13v13M1 14h24" /></svg>
              <output class="jp-readout" id="voice" aria-labelledby="voice-label">钢琴</output>
            </div>
          </div>
          <div class="jp-field jp-field--switch">
            <span class="jp-field__label" id="diagram-label">和弦图</span>
            <button type="button" class="jp-switch" id="diagram-toggle" role="switch" aria-checked="true" aria-labelledby="diagram-label"><span></span></button>
          </div>
          <div class="jp-tip">
            <svg viewBox="0 0 24 30" aria-hidden="true"><path d="M7 18q-8-12 4-17q13-4 14 9q0 6-5 9v5h-9v-5zM9 27h9" transform="translate(-2 1)" /></svg>
            <p><b>小提示：</b>点击谱面上的音符或歌词，就从那里开始播放；空格键播放 / 暂停。</p>
          </div>
        </div>
      </aside>
    </main>

    <!-- ===== Wooden playback console ===== -->
    <div class="jp-dock" id="dock">
      <div class="jp-console" role="toolbar" aria-label="播放控制">
        <div class="jp-console__group jp-console__transport">
          <button type="button" class="jp-play" id="play" aria-label="播放" title="播放（空格）">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2v9.6l8-4.8z" /></svg>
          </button>
          <button type="button" class="jp-icon" id="stop" aria-label="停止" title="停止并回到开头">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" /></svg>
          </button>
          <button type="button" class="jp-icon" id="prev" aria-label="上一首" title="上一首">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M19 4 7 12l12 8z" /></svg>
          </button>
          <button type="button" class="jp-icon" id="next" aria-label="下一首" title="下一首">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4v16M5 4l12 8-12 8z" /></svg>
          </button>
          <button type="button" class="jp-icon jp-icon--stroke" id="loop" aria-pressed="false" aria-label="循环播放" title="循环播放">
            <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M5 11q8-9 16 1m0 0-1.2-6m1.2 6-6-1.2M23 17q-8 9-16-1m0 0 1.2 6M7 16l6 1.2" /></svg>
          </button>
        </div>
        <div class="jp-console__group jp-console__seek">
          <div class="jp-seek">
            <div class="jp-wave" id="wave" aria-hidden="true"></div>
            <input id="seek" type="range" min="0" max="0" step="0.01" value="0" aria-label="播放位置" />
          </div>
          <span class="jp-clock" id="clock">0:00 / 0:00</span>
        </div>
        <div class="jp-console__group jp-console__volume" id="volume-group">
          <button type="button" class="jp-icon" id="mute" aria-pressed="false" aria-label="静音" title="静音">
            <svg viewBox="0 0 28 28" aria-hidden="true"><path class="fill" d="M4 10h5l7-6v20l-7-6H4z" /><path class="wave" d="M19.5 9.5q4.5 4.5 0 9M22.5 6.5q8 7.5 0 15" /><path class="cross" d="m19 10 7 8m0-8-7 8" /></svg>
          </button>
          <input id="volume" class="jp-volume" type="range" min="0" max="100" step="1" value="80" aria-label="音量" />
        </div>
        <div class="jp-console__group jp-console__rate">
          <span class="jp-select jp-select--wood"><select id="rate" aria-label="播放倍速"></select></span>
        </div>
        <div class="jp-console__group jp-views" role="group" aria-label="谱面视图">
          <button type="button" id="view-jianpu" aria-pressed="true" title="简谱"><span class="jp-views__num">123</span><span class="sr-only">简谱</span></button>
          <button type="button" id="view-staff" aria-pressed="false" title="五线谱">
            <svg viewBox="0 0 34 24" aria-hidden="true"><path d="M1 5h32M1 10h32M1 15h32M1 20h32" class="lines" /><path d="M14 5v13q0 4-4 4t-4-3q0-3 5-3M14 5l9-2" class="note" /></svg><span class="jp-views__txt">五线谱</span>
          </button>
          <button type="button" id="view-lead" aria-pressed="false" title="弹唱谱">
            <svg viewBox="0 0 44 26" aria-hidden="true"><path d="M3 5v14q0 6 6 5q6-2 6-7V3l18-4v14q0 6 6 4q5-2 5-7V-6" transform="translate(0 4) scale(.85)" /></svg><span class="jp-views__txt">弹唱</span>
          </button>
        </div>
      </div>
      <div class="jp-status">
        <button type="button" class="jp-follow" id="follow" role="switch" aria-checked="true" title="播放时谱面自动滚动到当前行">
          <span class="jp-follow__dot" aria-hidden="true"></span>跟随播放进度
        </button>
        <span class="jp-status__sep" aria-hidden="true">·</span>
        <span id="bar-status">当前小节 —</span>
        <span class="jp-status__voice" id="sound-status"></span>
      </div>
    </div>

    <script src="vendor/abc2svg-1.js"></script>
    <script src="vendor/jianpu-1.js"></script>
    <script src="vendor/diag-1.js"></script>
    <script src="vendor/piano.js"></script>
    <script src="vendor/score_edit.js"></script>
    <script src="player.js"></script>
  </body>
</html>
